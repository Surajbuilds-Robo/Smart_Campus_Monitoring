<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" style="display:block;">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="60%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="lawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Sky & Horizon -->
  <rect width="320" height="180" fill="url(#skyGrad)" />

  <!-- Background Trees -->
  <path d="M0,110 Q40,95 80,110 Q120,95 160,110 Q200,95 240,110 Q280,95 320,110 L320,140 L0,140 Z" fill="#64748b" opacity="0.6" />

  <!-- Academic Building Facade -->
  <rect x="50" y="55" width="220" height="65" rx="3" fill="url(#buildingGrad)" stroke="#94a3b8" stroke-width="1.5" />
  <rect x="120" y="42" width="80" height="78" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Triangular Pediment -->
  <polygon points="120,42 160,25 200,42" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Central Columns -->
  <line x1="135" y1="45" x2="135" y2="105" stroke="#94a3b8" stroke-width="3" />
  <line x1="150" y1="45" x2="150" y2="105" stroke="#94a3b8" stroke-width="3" />
  <line x1="170" y1="45" x2="170" y2="105" stroke="#94a3b8" stroke-width="3" />
  <line x1="185" y1="45" x2="185" y2="105" stroke="#94a3b8" stroke-width="3" />

  <!-- Windows Grid -->
  <g fill="#475569" opacity="0.85">
    <rect x="65" y="65" width="10" height="12" rx="1" />
    <rect x="85" y="65" width="10" height="12" rx="1" />
    <rect x="102" y="65" width="10" height="12" rx="1" />
    <rect x="65" y="85" width="10" height="12" rx="1" />
    <rect x="85" y="85" width="10" height="12" rx="1" />
    <rect x="102" y="85" width="10" height="12" rx="1" />

    <rect x="208" y="65" width="10" height="12" rx="1" />
    <rect x="225" y="65" width="10" height="12" rx="1" />
    <rect x="245" y="65" width="10" height="12" rx="1" />
    <rect x="208" y="85" width="10" height="12" rx="1" />
    <rect x="225" y="85" width="10" height="12" rx="1" />
    <rect x="245" y="85" width="10" height="12" rx="1" />
  </g>

  <!-- Ground Lawn & Front Walkway -->
  <rect x="0" y="120" width="320" height="60" fill="url(#lawnGrad)" />
  <polygon points="130,120 190,120 220,180 100,180" fill="#475569" opacity="0.7" />
  <line x1="160" y1="120" x2="160" y2="180" stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="1.5" />

  <!-- Front Ornamental Shrubs -->
  <circle cx="35" cy="125" r="10" fill="#334155" />
  <circle cx="285" cy="125" r="10" fill="#334155" />
</svg>
