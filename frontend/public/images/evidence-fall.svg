<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%">
  <!-- Pavement / Walkway Ground -->
  <rect width="240" height="140" fill="#64748b" />
  <rect x="0" y="0" width="240" height="40" fill="#94a3b8" />
  <!-- Grass border -->
  <rect x="0" y="38" width="240" height="6" fill="#15803d" />
  <!-- Pavement tiles -->
  <line x1="0" y1="70" x2="240" y2="70" stroke="#475569" stroke-width="1.5" />
  <line x1="0" y1="105" x2="240" y2="105" stroke="#475569" stroke-width="1.5" />
  <line x1="60" y1="44" x2="60" y2="140" stroke="#475569" stroke-width="1.5" />
  <line x1="120" y1="44" x2="120" y2="140" stroke="#475569" stroke-width="1.5" />
  <line x1="180" y1="44" x2="180" y2="140" stroke="#475569" stroke-width="1.5" />

  <!-- Fallen Person on pavement (matching the screenshot reference!) -->
  <g transform="translate(75, 78)">
    <!-- Shadow -->
    <ellipse cx="45" cy="18" rx="42" ry="7" fill="#1e293b" opacity="0.4" />
    <!-- Body horizontal -->
    <circle cx="10" cy="12" r="7" fill="#fed7aa" stroke="#78350f" stroke-width="0.5" />
    <!-- Hair -->
    <path d="M 5 8 Q 11 5 15 9 Q 12 14 6 12 Z" fill="#0f172a" />
    <!-- Torso white / light gray jacket -->
    <rect x="16" y="8" width="34" height="12" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
    <!-- Legs in dark pants -->
    <path d="M 50 11 L 82 14 L 80 18 L 48 16 Z" fill="#1e3a8a" />
    <path d="M 50 14 L 78 20 L 76 24 L 48 18 Z" fill="#1e40af" />
    <!-- Shoes -->
    <rect x="80" y="13" width="7" height="4" rx="1.5" fill="#0f172a" />
    <rect x="76" y="20" width="7" height="4" rx="1.5" fill="#0f172a" />
    <!-- Arms -->
    <path d="M 22 18 L 32 23" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Red AI bounding box over fallen individual -->
  <rect x="68" y="70" width="98" height="34" rx="3" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2" />
  <rect x="68" y="60" width="75" height="10" rx="2" fill="#ef4444" />
  <text x="71" y="68" font-family="monospace" font-size="7" fill="#ffffff" font-weight="bold">AI: PERSON FALL 98%</text>

  <!-- CCTV timestamp in top right -->
  <rect x="155" y="6" width="78" height="14" rx="2" fill="#0f172a" opacity="0.8" />
  <text x="160" y="16" font-family="monospace" font-size="8" fill="#f8fafc">17:19:04 SEC</text>
</svg>
