<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%">
  <!-- Cafeteria / Lobby crowded background -->
  <rect width="240" height="140" fill="#94a3b8" />
  <!-- Dining tables -->
  <rect x="20" y="45" width="200" height="25" rx="3" fill="#b45309" />
  <rect x="15" y="85" width="210" height="30" rx="4" fill="#d97706" />

  <!-- Dense Crowd of People -->
  <g fill="#0f172a">
    <circle cx="35" cy="40" r="5" /><circle cx="55" cy="38" r="5" /><circle cx="75" cy="41" r="5" /><circle cx="95" cy="39" r="5" />
    <circle cx="115" cy="40" r="5" /><circle cx="135" cy="38" r="5" /><circle cx="155" cy="41" r="5" /><circle cx="175" cy="39" r="5" />
    <circle cx="195" cy="40" r="5" />

    <circle cx="30" cy="80" r="6" /><circle cx="55" cy="78" r="6" /><circle cx="80" cy="81" r="6" /><circle cx="105" cy="79" r="6" />
    <circle cx="130" cy="80" r="6" /><circle cx="155" cy="78" r="6" /><circle cx="180" cy="81" r="6" /><circle cx="205" cy="79" r="6" />

    <circle cx="30" cy="122" r="6" /><circle cx="55" cy="120" r="6" /><circle cx="80" cy="123" r="6" /><circle cx="105" cy="121" r="6" />
    <circle cx="130" cy="122" r="6" /><circle cx="155" cy="120" r="6" /><circle cx="180" cy="123" r="6" /><circle cx="205" cy="121" r="6" />
  </g>

  <!-- Amber AI Density heat zone overlay -->
  <rect x="40" y="30" width="160" height="95" rx="10" fill="#f59e0b" opacity="0.25" />
  <rect x="40" y="30" width="160" height="95" rx="10" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2" />
  <rect x="40" y="20" width="80" height="10" rx="2" fill="#f59e0b" />
  <text x="43" y="28" font-family="monospace" font-size="7" fill="#0f172a" font-weight="bold">AI: CROWD DENSITY 88%</text>

  <!-- CCTV timestamp -->
  <rect x="155" y="6" width="78" height="14" rx="2" fill="#0f172a" opacity="0.8" />
  <text x="160" y="16" font-family="monospace" font-size="8" fill="#f8fafc">17:06:12 SEC</text>
</svg>
