<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <linearGradient id="asphaltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Asphalt Ground -->
  <rect width="480" height="270" fill="url(#asphaltGrad)" />

  <!-- Background Campus Building & Trees (Angled Overhead CCTV) -->
  <rect x="0" y="0" width="480" height="50" fill="#94a3b8" />
  <g fill="#15803d" opacity="0.8">
    <circle cx="40" cy="45" r="15" /><circle cx="80" cy="48" r="14" /><circle cx="120" cy="45" r="16" />
    <circle cx="280" cy="48" r="15" /><circle cx="330" cy="46" r="14" /><circle cx="420" cy="47" r="16" />
  </g>

  <!-- Parking Bay Lines Row 1 (Top) -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.85">
    <line x1="40" y1="55" x2="40" y2="105" />
    <line x1="85" y1="55" x2="85" y2="105" />
    <line x1="130" y1="55" x2="130" y2="105" />
    <line x1="175" y1="55" x2="175" y2="105" />
    <line x1="220" y1="55" x2="220" y2="105" />
    <line x1="265" y1="55" x2="265" y2="105" />
    <line x1="310" y1="55" x2="310" y2="105" />
    <line x1="355" y1="55" x2="355" y2="105" />
    <line x1="400" y1="55" x2="400" y2="105" />
    <line x1="445" y1="55" x2="445" y2="105" />
  </g>

  <!-- Parked Cars Row 1 -->
  <rect x="47" y="60" width="30" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
  <rect x="92" y="60" width="30" height="42" rx="4" fill="#3b82f6" />
  <rect x="137" y="60" width="30" height="42" rx="4" fill="#64748b" />
  <!-- empty bay at 175-220 -->
  <rect x="227" y="60" width="30" height="42" rx="4" fill="#f8fafc" />
  <rect x="272" y="60" width="30" height="42" rx="4" fill="#dc2626" />
  <rect x="317" y="60" width="30" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
  <rect x="362" y="60" width="30" height="42" rx="4" fill="#1e293b" />
  <rect x="407" y="60" width="30" height="42" rx="4" fill="#cbd5e1" />

  <!-- Drive Aisle Line Markings -->
  <line x1="20" y1="135" x2="460" y2="135" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="15,15" opacity="0.5" />

  <!-- Parking Bay Lines Row 2 (Bottom) -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.85">
    <line x1="40" y1="165" x2="40" y2="245" />
    <line x1="95" y1="165" x2="95" y2="245" />
    <line x1="150" y1="165" x2="150" y2="245" />
    <line x1="205" y1="165" x2="205" y2="245" />
    <line x1="260" y1="165" x2="260" y2="245" />
    <line x1="315" y1="165" x2="315" y2="245" />
    <line x1="370" y1="165" x2="370" y2="245" />
    <line x1="425" y1="165" x2="425" y2="245" />
  </g>

  <!-- Parked Cars Row 2 (Larger perspective) -->
  <!-- White Sedan -->
  <g transform="translate(48, 172)">
    <rect x="0" y="0" width="38" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="5" y="16" width="28" height="28" rx="4" fill="#64748b" />
    <rect x="7" y="18" width="24" height="24" rx="2" fill="#38bdf8" opacity="0.6" />
  </g>
  <!-- Silver SUV -->
  <g transform="translate(103, 170)">
    <rect x="0" y="0" width="40" height="68" rx="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="5" y="14" width="30" height="34" rx="4" fill="#475569" />
  </g>
  <!-- Black Sedan -->
  <g transform="translate(158, 172)">
    <rect x="0" y="0" width="38" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect x="5" y="16" width="28" height="28" rx="4" fill="#1e293b" />
  </g>
  <!-- White Car -->
  <g transform="translate(268, 172)">
    <rect x="0" y="0" width="38" height="65" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="5" y="16" width="28" height="28" rx="4" fill="#64748b" />
  </g>
  <!-- Dark Blue Car -->
  <g transform="translate(323, 170)">
    <rect x="0" y="0" width="39" height="67" rx="6" fill="#1e3a8a" stroke="#172554" stroke-width="1.5" />
    <rect x="5" y="15" width="29" height="30" rx="4" fill="#0f172a" />
  </g>
  <!-- Silver Car -->
  <g transform="translate(378, 172)">
    <rect x="0" y="0" width="38" height="65" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="5" y="16" width="28" height="28" rx="4" fill="#64748b" />
  </g>

  <!-- CCTV Overlay HUD -->
  <rect width="480" height="270" fill="#0284c7" opacity="0.04" />
  <path d="M 12 24 L 12 12 L 24 12" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 468 24 L 468 12 L 456 12" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 12 246 L 12 258 L 24 258" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 468 246 L 468 258 L 456 258" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8" />

  <text x="20" y="26" font-family="monospace" font-size="10" fill="#f8fafc" font-weight="bold" letter-spacing="1">CAM-02 • PARKING H1 • 1080P</text>
  <text x="20" y="254" font-family="monospace" font-size="9" fill="#38bdf8" font-weight="bold">AI PARKING SENSOR: 45 VEHICLES DETECTED | 12 FREE BAYS</text>
</svg>
